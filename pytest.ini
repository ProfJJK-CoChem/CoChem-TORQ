[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    cpu_ml: requires optional CPU PyTorch/ML dependencies
    real_engine: executes genuine electronic-structure calculations
    student_profile: bounded canonical student workflow
    research: independently gated research implementation
    ecosystem: requires genuine separately verified sibling environments
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
