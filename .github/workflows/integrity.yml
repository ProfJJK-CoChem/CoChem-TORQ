name: Scientific data integrity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    env:
      # CI is already isolated. This bypasses only the historical cwd-name check.
      COCHEM_DISABLE_SANDBOX_CHECK: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0, Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0, Node 24
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Build distributable
        run: |
          python -m pip install build
          python -m build --wheel
      - name: Install wheel with declared core validation dependencies
        run: |
          if [ '${{ matrix.python }}' = '3.12' ]; then
            python -m pip install --require-hashes -r ci_tools/requirements-core-py312.txt
          fi
          python -m pip install dist/*.whl
          python -m pip install 'pytest>=8,<10' 'qcelemental>=0.29,<1' 'ruff==0.16.10'
          python -m pip check
      - name: Import and invoke installed package outside checkout
        working-directory: /tmp
        run: |
          python -I -c "import cochem_torq, Libraries.cochem_torq_export, cochem.orchestration.sqlite_queue, cochem.storage.cochem_core_pes_store, orchestrator, UI.torq_controller; print('installed package imports passed')"
          cochem-torq --help
      - name: Record full SRS coverage and unresolved qualifications
        run: |
          python ci_tools/validate_release_evidence.py > "$RUNNER_TEMP/torq-full-srs-audit.json"
          cat "$RUNNER_TEMP/torq-full-srs-audit.json"
      - name: Require application implementation lint and formatting
        run: |
          python -m ruff check src/cochem_torq cochem/orchestration/campaign.py cochem/orchestration/campaign_backup.py cochem/orchestration/host_allocation.py cochem/storage/fenced_pes.py ci_tools/validate_release_evidence.py ci_tools/run_repository_regression.py ci_tools/setup_reviewed_topos.py ci_tools/provision_pickett_validation.py
          python -m ruff format --check src/cochem_torq cochem/orchestration/campaign.py cochem/orchestration/campaign_backup.py cochem/orchestration/host_allocation.py cochem/storage/fenced_pes.py ci_tools/validate_release_evidence.py ci_tools/run_repository_regression.py ci_tools/setup_reviewed_topos.py ci_tools/provision_pickett_validation.py
      - name: Run core scientific-data and persistence regression tests
        run: |
          if python -I -c 'import sys, pytest; import cochem_torq, Libraries, cochem, core, orchestrator, UI, scripts; packages=(cochem_torq,Libraries,cochem,core,orchestrator,UI,scripts); [setattr(package,"__path__",list(package.__path__)) for package in packages]; raise SystemExit(pytest.main(sys.argv[1:]))' -q -m 'not cpu_ml and not real_engine and not ecosystem' \
            --junitxml "$RUNNER_TEMP/torq-core-tests-report.xml" \
            tests/test_engine_integrity.py tests/test_export_integrity.py \
            tests/test_persistence_integrity.py tests/test_cfour_integrity.py \
            tests/test_spectroscopy_integrity.py tests/test_element_integrity.py \
            tests/test_spcat_integrity.py tests/test_async_runner_integrity.py \
            tests/test_model_selection_integrity.py tests/test_wkb_integrity.py \
            tests/test_spcat_script_integrity.py tests/test_mobile_auth_integrity.py \
            tests/test_operations_integrity.py tests/test_chain.py \
            tests/test_service_lifecycle.py tests/test_service_input_integrity.py \
            tests/test_canonical_serialization.py tests/test_scientific_contracts.py \
            tests/test_campaign_coordinator.py tests/test_campaign_backup.py tests/test_host_allocation.py tests/test_release_evidence_validator.py \
            tests/test_advanced_scientific_results.py tests/test_ecosystem_serialization_profile.py \
            tests/test_units.py tests/test_asymmetric_rotor.py tests/test_ingestion_integrity.py \
            tests/test_topology_mass_integrity.py tests/test_goat_rmsd_integrity.py \
            tests/test_ipc_mass_integrity.py \
            tests/test_cascade_admission_integrity.py \
            tests/test_crest_identity_integrity.py \
            tests/test_capability_restart_integrity.py tests/test_candidate_ledger_integrity.py \
            tests/test_candidate_interface_integrity.py tests/test_publication_integrity.py \
            tests/test_fenced_pes_integrity.py tests/test_repository_regression_evidence.py \
            tests/test_pes_scan_integrity.py tests/test_adaptive_pes_integrity.py \
            tests/torq/test_counterpoise_frozen_monomer.py; then
            python ci_tools/require_no_skips.py "$RUNNER_TEMP/torq-core-tests-report.xml"
          else
            torq_command_status=$?
            python ci_tools/annotate_ci_failure.py --junit "$RUNNER_TEMP/torq-core-tests-report.xml" || true
            exit "$torq_command_status"
          fi
      - name: Retain wheel for inspection
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheel-python-${{ matrix.python }}
          path: |
            dist/*.whl
            ${{ runner.temp }}/torq-core-tests-report.xml
            ${{ runner.temp }}/torq-full-srs-audit.json
          if-no-files-found: error
          retention-days: 30

  cpu-numerical-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      COCHEM_DISABLE_SANDBOX_CHECK: '1'
      JAX_ENABLE_X64: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0, Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0, Node 24
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU compute dependencies
        run: |
          python -m pip install 'torch>=2.4' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install '.[dev,dvr,ml,qcschema,dispersion,molecular,telemetry]'
          python -m pip check
      - name: Validate mathematical and surrogate integrity paths
        run: |
          python -m pytest -q --junitxml "$RUNNER_TEMP/torq-cpu-numerical-report.xml" \
            tests/test_numerical_integrity.py tests/test_surrogate_integrity.py tests/test_remaining_scientific_integrity.py \
            tests/test_geometry_identity_integrity.py \
            tests/test_dvr.py tests/test_asymmetric_rotor.py tests/test_jax_builder.py tests/test_slicer.py
          python ci_tools/require_no_skips.py "$RUNNER_TEMP/torq-cpu-numerical-report.xml"
          python -m pytest -q -m cpu_ml --junitxml "$RUNNER_TEMP/torq-cpu-persistence-report.xml" tests/test_persistence_integrity.py
          python ci_tools/require_no_skips.py "$RUNNER_TEMP/torq-cpu-persistence-report.xml"
      - name: Require genuine molecular, dispersion and telemetry checks
        run: |
          python -m pytest -q --basetemp "$RUNNER_TEMP/torq-optional-scientific-tests" \
            --junitxml "$RUNNER_TEMP/torq-optional-scientific-tests-report.xml" \
            tests/test_additional_physical_integrity.py tests/test_dispersion_reference_integrity.py \
            tests/test_oet_result_integrity.py tests/test_rdkit_result_integrity.py \
            tests/test_mobile_assembly_constants.py tests/test_mobile_assembly_integrity.py \
            tests/test_committee_memory_integrity.py \
            tests/test_torq_telemetry.py
          python ci_tools/require_no_skips.py "$RUNNER_TEMP/torq-optional-scientific-tests-report.xml"
      - name: Retain optional scientific model evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: torq-optional-scientific-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/torq-optional-scientific-tests/
            ${{ runner.temp }}/torq-optional-scientific-tests-report.xml
            ${{ runner.temp }}/torq-cpu-numerical-report.xml
            ${{ runner.temp }}/torq-cpu-persistence-report.xml
          if-no-files-found: error
          retention-days: 30

  real-student-engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      COCHEM_DISABLE_SANDBOX_CHECK: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      QT_QPA_PLATFORM: offscreen
      COCHEM_HEADLESS: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0, Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0, Node 24
        with:
          python-version: '3.12'
          cache: pip
      - name: Install the genuine named engine and student contracts
        run: |
          python -m pip install --require-hashes -r ci_tools/requirements-pyscf-py312.txt -r ci_tools/requirements-interface-py312.txt
          python -m pip install --no-deps .
          python -m pip install 'pytest>=8,<10'
          python -m pip check
          python -c "import pyscf, geometric; from dftd4.interface import DispersionModel; from importlib.metadata import version; assert pyscf.__version__ == '2.14.0'; assert version('geometric') == '1.1.1'; assert version('dftd4') == '3.7.0'"
      - name: Compile external Pickett executables for mandatory validation
        run: |
          python ci_tools/provision_pickett_validation.py --root "$RUNNER_TEMP/pickett-validation" --github-env "$GITHUB_ENV"
      - name: Require actual energies, derivatives and optimization
        run: |
          if python -m pytest -q -m 'not ecosystem' --basetemp "$RUNNER_TEMP/torq-native-tests" \
            --junitxml "$RUNNER_TEMP/torq-native-tests-report.xml" \
            tests/test_pyscf_integration.py tests/test_revdsd_integration.py \
            tests/test_double_hybrid_stability_integrity.py tests/test_pes_scan_integrity.py \
            tests/test_adaptive_pes_integrity.py tests/test_rovibrational_precursors.py \
            tests/test_spectroscopy_physics.py tests/test_student_execution.py \
            tests/test_application_contracts.py tests/test_actions_request.py \
            tests/test_artifact_publication.py tests/test_anharmonic_research.py \
            tests/test_internal_coordinate_scans.py tests/test_native_pes_storage.py \
            tests/test_native_checkpoint_consumption.py tests/test_constrained_optimization.py \
            tests/test_constrained_service.py tests/test_scan_host_allocation.py \
            tests/test_open_shell_engine.py tests/test_open_shell_service.py \
            tests/test_rovibrational_solver.py tests/test_rovibrational_perturbation.py \
            tests/test_watson_pipeline.py tests/test_landscape_inspection.py \
            tests/test_benchmarking_integrity.py tests/test_revdsd_exact_milestones.py \
            tests/test_operations_integrity.py tests/test_chain.py \
            tests/test_energetics_integration.py tests/test_pathway_diagnostics_integration.py \
            tests/test_goal_execution_integrity.py \
            tests/test_publication_integrity.py tests/test_capability_restart_integrity.py \
            tests/test_repository_regression_evidence.py tests/test_pickett_backend.py tests/test_pickett_provisioning.py \
            tests/test_advanced_scientific_results.py tests/torq/test_counterpoise_frozen_monomer.py; then
            python ci_tools/require_no_skips.py "$RUNNER_TEMP/torq-native-tests-report.xml"
          else
            torq_command_status=$?
            python ci_tools/annotate_ci_failure.py --junit "$RUNNER_TEMP/torq-native-tests-report.xml" || true
            exit "$torq_command_status"
          fi
      - name: Record native derivative qualification evidence
        run: |
          python ci_tools/qualify_pyscf_image.py --output "$RUNNER_TEMP/torq-qualification" \
            --image-identity hosted-runner-python-env --source-commit "$GITHUB_SHA"
      - name: Prepare bounded public native evidence without fixture credentials
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from ci_tools.run_repository_regression import curate_engine_evidence, sanitize_junit
          root = Path(os.environ['RUNNER_TEMP'])
          public = root / 'torq-native-public'
          public.mkdir()
          source = root / 'torq-native-tests'
          summary = {
              'scope': 'verified current-adapter PySCF inventories and actual scrubbed test outcomes',
              'source_directory_present': source.is_dir(),
              'native_evidence': curate_engine_evidence(source, public / 'native-evidence', Path.cwd()),
              'junit': None,
              'independent_scientific_qualification': False,
          }
          report = root / 'torq-native-tests-report.xml'
          if report.is_file():
              summary['junit'] = sanitize_junit(report, public / 'junit.xml')
          (public / 'retention-summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          PY
      - name: Retain genuine engine evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: torq-real-engine-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/torq-qualification/
            ${{ runner.temp }}/torq-native-public/
          if-no-files-found: error
          retention-days: 30

  student-calculation-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0, Node 24
        with:
          persist-credentials: false
      - name: Build the actual isolated calculation image
        run: |
          mkdir -p "$RUNNER_TEMP/torq-image-evidence" "$RUNNER_TEMP/torq-image-input" "$RUNNER_TEMP/torq-image-results"
          chmod 775 "$RUNNER_TEMP/torq-image-evidence" "$RUNNER_TEMP/torq-image-input" "$RUNNER_TEMP/torq-image-results"
          sudo chown "1000:$(id -g)" "$RUNNER_TEMP/torq-image-evidence" "$RUNNER_TEMP/torq-image-input" "$RUNNER_TEMP/torq-image-results"
          git rev-parse HEAD > "$RUNNER_TEMP/torq-image-evidence/source-commit.txt"
          if docker build --progress=plain --file docker/engines/pyscf/Dockerfile --tag torq-pyscf:${GITHUB_SHA} . > "$RUNNER_TEMP/torq-image-evidence/build.log" 2>&1; then
            cat "$RUNNER_TEMP/torq-image-evidence/build.log"
          else
            torq_command_status=$?
            python3 ci_tools/annotate_ci_failure.py --build-log "$RUNNER_TEMP/torq-image-evidence/build.log" || true
            exit "$torq_command_status"
          fi
          docker image inspect torq-pyscf:${GITHUB_SHA} --format '{{.Id}}' > "$RUNNER_TEMP/torq-image-evidence/image-id.txt"
      - name: Normalize and hash the actual student water request
        run: |
          timeout --signal=TERM --kill-after=15s 180s docker run --rm -i --name torq-image-prepare-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} --network none --cpus 2 --memory 3g --pids-limit 256 \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,size=1g \
            --mount "type=bind,src=$RUNNER_TEMP/torq-image-input,dst=/input" \
            --env COCHEM_SOURCE_COMMIT="$GITHUB_SHA" \
            --entrypoint python torq-pyscf:${GITHUB_SHA} - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import json
          from cochem_torq.domain import CalculationRequest, canonical_json
          from cochem_torq.service import approve_plan, plan_request
          example = Path('/opt/torq-source/examples/student/water-hf-teaching.json')
          data = json.loads(example.read_text())
          data['products'].append('rigid_rotor_catalog')
          data['source_provenance']['example_file_sha256'] = sha256(example.read_bytes()).hexdigest()
          request = CalculationRequest.model_validate(data)
          encoded = canonical_json(request.model_dump(mode='json'))
          root = Path('/input')
          (root / 'request.json').write_bytes(encoded)
          (root / 'request-id.txt').write_text(str(request.request_id))
          (root / 'request-sha256.txt').write_text(sha256(encoded).hexdigest())
          approval = approve_plan(plan_request(request), actor='github-actions-image-qualification')
          approval_bytes = canonical_json(approval)
          (root / 'approved-plan.json').write_bytes(approval_bytes)
          (root / 'approved-plan-sha256.txt').write_text(sha256(approval_bytes).hexdigest())
          PY
      - name: Require genuine image energy and derivative qualification
        run: |
          timeout --signal=TERM --kill-after=15s 180s docker run --rm --name torq-image-qualification-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} --network none --cpus 2 --memory 3g --pids-limit 256 \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,size=1g \
            --mount "type=bind,src=$RUNNER_TEMP/torq-image-evidence,dst=/evidence" \
            --entrypoint python torq-pyscf:${GITHUB_SHA} \
            /opt/torq-source/ci_tools/qualify_pyscf_image.py \
            --output /evidence/qualification \
            --image-identity "$(cat "$RUNNER_TEMP/torq-image-evidence/image-id.txt")" --source-commit "$GITHUB_SHA"
      - name: Execute the genuine water pipeline offline
        run: |
          if timeout --signal=TERM --kill-after=15s 660s docker run --rm --name torq-image-calculation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} --network none --cpus 2 --memory 3g --pids-limit 256 \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,size=1g \
            --mount "type=bind,src=$RUNNER_TEMP/torq-image-input,dst=/input,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/torq-image-results,dst=/results" \
            --env TMPDIR=/results \
            --env COCHEM_SOURCE_COMMIT="$GITHUB_SHA" \
            --env COCHEM_IMAGE_ID="$(cat "$RUNNER_TEMP/torq-image-evidence/image-id.txt")" \
            torq-pyscf:${GITHUB_SHA} execute --request /input/request.json \
            --approved-plan /input/approved-plan.json \
            --expected-approval-sha256 "$(cat "$RUNNER_TEMP/torq-image-input/approved-plan-sha256.txt")" \
            --output-dir /results/water --request-id "$(cat "$RUNNER_TEMP/torq-image-input/request-id.txt")" \
            --expected-sha256 "$(cat "$RUNNER_TEMP/torq-image-input/request-sha256.txt")" > "$RUNNER_TEMP/torq-image-evidence/calculation.log" 2>&1; then
            cat "$RUNNER_TEMP/torq-image-evidence/calculation.log"
          else
            torq_calculation_status=$?
            python3 - <<'PY'
          import os
          from pathlib import Path
          from ci_tools.annotate_ci_failure import annotate
          path = Path(os.environ['RUNNER_TEMP']) / 'torq-image-evidence/calculation.log'
          with path.open('rb') as stream:
              stream.seek(0, 2)
              offset = max(0, stream.tell() - 24000)
              stream.seek(offset)
              diagnostic = stream.read()
          if offset:
              boundary = diagnostic.find(b'\n')
              diagnostic = diagnostic[boundary + 1:] if boundary >= 0 else b''
          annotate('The actual offline calculation failed. CLI diagnostic:\n' + diagnostic.decode('utf-8', errors='replace'))
          PY
            exit "$torq_calculation_status"
          fi
      - name: Verify the sealed typed artifact in the actual image
        run: |
          timeout --signal=TERM --kill-after=15s 180s docker run --rm -i --name torq-image-verification-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} --network none --cpus 2 --memory 3g --pids-limit 256 \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,size=1g \
            --mount "type=bind,src=$RUNNER_TEMP/torq-image-results,dst=/results,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/torq-image-input,dst=/input,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/torq-image-evidence,dst=/evidence" \
            --env COCHEM_SOURCE_COMMIT="$GITHUB_SHA" \
            --env COCHEM_IMAGE_ID="$(cat "$RUNNER_TEMP/torq-image-evidence/image-id.txt")" \
            --entrypoint python torq-pyscf:${GITHUB_SHA} - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import json, os
          from cochem_torq.artifacts import verify_shard
          root = Path('/results/water')
          manifest = verify_shard(root, expected_request_sha256=Path('/input/request-sha256.txt').read_text())
          result = json.loads((root / 'result.json').read_text())
          assert result['status'] == 'complete' and not result['errors']
          for stage in ('equilibrium_geometry', 'harmonic_analysis', 'equilibrium_constants', 'rigid_rotor_catalog'):
              assert result['stages'][stage]['status'] == 'available', stage
          assert not result['identification_ready'] and not result['experimental_accuracy_established']
          assert manifest['source_identity']['declared_workflow_commit'] == os.environ['COCHEM_SOURCE_COMMIT']
          assert manifest['source_identity']['declared_engine_image'] == os.environ['COCHEM_IMAGE_ID']
          evidence = {'status': 'passed', 'request_id': manifest['request_id'], 'verified_files': len(manifest['files']),
                      'manifest_sha256': sha256((root / 'manifest.json').read_bytes()).hexdigest(),
                      'source_identity': manifest['source_identity'], 'identification_ready': False}
          (Path('/evidence') / 'sealed-result-verification.json').write_text(json.dumps(evidence, indent=2) + '\n')
          print(json.dumps(evidence))
          PY
      - name: Reap only containers owned by this image qualification attempt
        if: always()
        run: |
          docker rm --force torq-image-prepare-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} torq-image-qualification-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} torq-image-calculation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} torq-image-verification-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} 2>/dev/null || true
      - name: Grant the authenticated runner group read access to owned image results
        if: always()
        run: |
          for torq_owned_root in "$RUNNER_TEMP/torq-image-results" "$RUNNER_TEMP/torq-image-evidence" "$RUNNER_TEMP/torq-image-input"; do
            if [ -d "$torq_owned_root" ]; then
              sudo chgrp -R "$(id -g)" "$torq_owned_root"
              sudo chmod -R g+rX "$torq_owned_root"
            fi
          done
      - name: Retain real calculation image artifacts and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: torq-calculation-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/torq-image-results/
            ${{ runner.temp }}/torq-image-evidence/
            ${{ runner.temp }}/torq-image-input/
          if-no-files-found: error
          retention-days: 30
          overwrite: false

  real-ecosystem-consumers:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      COCHEM_DISABLE_SANDBOX_CHECK: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      COCHEM_REQUIRE_ECOSYSTEM: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      QT_QPA_PLATFORM: offscreen
      COCHEM_HEADLESS: '1'
      COCHEM_MODULES_APP_CONFIGURED: ${{ vars.COCHEM_MODULES_APP_ID != '' && secrets.COCHEM_MODULES_APP_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0, Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0, Node 24
        with:
          python-version: '3.12'
          cache: pip
      - name: Mint narrowly scoped sibling source token
