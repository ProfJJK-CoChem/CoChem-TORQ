          retention-days: 30

  complete-repository-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 66
    env:
      COCHEM_DISABLE_SANDBOX_CHECK: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      JAX_ENABLE_X64: 'true'
      COCHEM_REQUIRE_ECOSYSTEM: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      QT_QPA_PLATFORM: offscreen
      COCHEM_HEADLESS: '1'
      COCHEM_MODULES_APP_CONFIGURED: ${{ vars.COCHEM_MODULES_APP_ID != '' && secrets.COCHEM_MODULES_APP_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0, Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0, Node 24
        with:
          python-version: '3.12'
          cache: pip
      - name: Mint narrowly scoped sibling source token
        if: env.COCHEM_MODULES_APP_CONFIGURED == 'true'
        id: module-auth
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0, Node 24
        with:
          app-id: ${{ vars.COCHEM_MODULES_APP_ID }}
          private-key: ${{ secrets.COCHEM_MODULES_APP_PRIVATE_KEY }}
          owner: ProfJJK-CoChem
          repositories: |
            CoChem-BASE
            CoChem-TOPOS
          permission-contents: read
      - name: Install the reproduced complete validation environment
        run: |
          python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --require-hashes -r ci_tools/requirements-core-py312.txt -r ci_tools/requirements-pyscf-py312.txt -r ci_tools/requirements-interface-py312.txt
          python -m pip install -r ci_tools/requirements-release-validation-py312.txt
          python -m pip install --no-deps .
          python -m pip check
      - name: Install the actual pinned sibling environments
        env:
          COCHEM_SOURCE_READ_TOKEN: ${{ steps.module-auth.outputs.token || secrets.COCHEM_SOURCE_READ_TOKEN }}
        run: |
          python scripts/student_setup.py setup --no-interface-install --artifact-dir "$RUNNER_TEMP/cochem-full-regression"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'cochem-full-regression'
          with open(os.environ['GITHUB_ENV'], 'a') as target:
              target.write(f'COCHEM_ARTIFACT_DIR={root}\n')
              target.write(f'COCHEM_MODULE_ROOT={root / "Modules"}\n')
              target.write(f'COCHEM_MODULE_MANIFEST={Path.cwd() / "ci_tools/ecosystem-modules.json"}\n')
              for module in ('base', 'topos'):
                  receipt = json.loads((root / 'Modules' / module / 'installation.json').read_text())
                  target.write(f'COCHEM_{module.upper()}_SOURCE={receipt["source_path"]}\n')
                  target.write(f'COCHEM_{module.upper()}_PYTHON={receipt["python_path"]}\n')
          PY
      - name: Install isolated reviewed TOPOS consumer contract
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python ci_tools/setup_reviewed_topos.py --root "$RUNNER_TEMP/reviewed-topos"
          echo "COCHEM_REVIEWED_TOPOS_ROOT=$RUNNER_TEMP/reviewed-topos" >> "$GITHUB_ENV"
      - name: Compile external Pickett executables for mandatory validation
        run: |
          python ci_tools/provision_pickett_validation.py --root "$RUNNER_TEMP/pickett-validation" --github-env "$GITHUB_ENV"
      - name: Require complete source-bound regression with zero skips
        run: |
          python -m ruff check src/cochem_torq cochem/orchestration/campaign.py cochem/orchestration/campaign_backup.py cochem/orchestration/host_allocation.py cochem/storage/fenced_pes.py ci_tools/validate_release_evidence.py ci_tools/run_repository_regression.py ci_tools/setup_reviewed_topos.py ci_tools/provision_pickett_validation.py
          python -m ruff format --check src/cochem_torq cochem/orchestration/campaign.py cochem/orchestration/campaign_backup.py cochem/orchestration/host_allocation.py cochem/storage/fenced_pes.py ci_tools/validate_release_evidence.py ci_tools/run_repository_regression.py ci_tools/setup_reviewed_topos.py ci_tools/provision_pickett_validation.py
          python -m mypy src/cochem_torq --follow-imports=silent --ignore-missing-imports
          if python ci_tools/run_repository_regression.py --output "$RUNNER_TEMP/torq-complete-regression" --basetemp "$RUNNER_TEMP/cochem_exec_complete-regression" --timeout 3600; then
            :
          else
            torq_command_status=$?
            python ci_tools/annotate_ci_failure.py --junit "$RUNNER_TEMP/torq-complete-regression/public/junit.xml" || true
            exit "$torq_command_status"
          fi
      - name: Retain bounded reports and verified scientific native inventories
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: torq-complete-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/torq-complete-regression/public/
            ${{ runner.temp }}/cochem-full-regression/Modules/*/installation.json
            ${{ runner.temp }}/reviewed-topos/*/receipt.json
          if-no-files-found: error
          retention-days: 30

